# End-to-end stack (SPEC.md §4.6, T1.13b). Used with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up --wait
# Every provider is pinned to its mock, whatever the shell says, webhooks fire at once,
# and the api migrates and runs `seed_e2e` before it serves.

# (Compose merges `environment` across files, so only the e2e values are set here.)
x-e2e-env: &e2e-env
  PAYMENT_PROVIDER: mock
  CARRIER_PROVIDER: mock
  EMAIL_PROVIDER: file
  MEDIA_STORAGE: local
  POSTAL_CODE_DATASET: sample
  ERROR_TRACKING: "off"
  INVOICE_PROVIDER: manual
  DEV_TOOLS_ENABLED: "true"
  MOCK_WEBHOOK_DELAY_SECONDS: "0"

services:
  api:
    environment:
      <<: *e2e-env
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py seed_e2e && python manage.py runserver 0.0.0.0:8000
    healthcheck:
      # The first schema request runs alone, here: drf-spectacular loads its extensions lazily and
      # two concurrent first requests (the desktop and mobile projects) can crash it with a 500.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; [u.urlopen('http://localhost:8000' + p) for p in ('/api/health/', '/api/schema/')]"
      interval: 3s
      timeout: 5s
      retries: 40

  mock-webhooks:
    environment:
      <<: *e2e-env

  web:
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

  # The storefront with its API target unreachable, for P12-V25 (T12.10). It is off unless the
  # `api-down` profile is asked for; the spec starts and stops it. Nitro bakes the proxy target at
  # start, so this needs its own server. It does not depend on `api`.
  web-api-down:
    profiles: [api-down]
    build:
      context: ./web
      secrets:
        - node_auth_token
    command: ["pnpm", "dev", "--host", "0.0.0.0", "--port", "3001"]
    environment:
      NUXT_API_SERVER_TARGET: http://api-unreachable.invalid:8000
      NUXT_PUBLIC_API_BASE: /api
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./web:/app
      - ./api/openapi.snapshot.yml:/api/openapi.snapshot.yml:ro
      - web_node_modules:/app/node_modules
      - web_nuxt_api_down:/app/.nuxt
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/').then(() => process.exit(0)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

  # The storefront as a production build, for the Lighthouse budgets (T12.12, P12-V02): the dev
  # server that `web` runs is not what a customer gets, and its size and blocking time would fail
  # any budget. Off unless the `lighthouse` profile is asked for; the test starts and stops it.
  web-prod:
    profiles: [lighthouse]
    build:
      context: ./web
      secrets:
        - node_auth_token
    command:
      - sh
      - -c
      - pnpm exec nuxt prepare && pnpm build && node .output/server/index.mjs
    environment:
      NUXT_API_SERVER_TARGET: http://api:8000
      NUXT_PUBLIC_API_BASE: /api
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      - ./web:/app
      - ./api/openapi.snapshot.yml:/api/openapi.snapshot.yml:ro
      - web_node_modules:/app/node_modules
      - web_nuxt_prod:/app/.nuxt
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 10s
      retries: 90
      start_period: 30s

  # Caddy in front of `web-prod`, on port 8081: the same routes as `proxy`, a different storefront.
  proxy-prod:
    profiles: [lighthouse]
    image: caddy:2.10-alpine
    environment:
      SITE_ADDRESS: ":8081"
      WEB_UPSTREAM: web-prod:3000
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/api/health/"]
      interval: 3s
      timeout: 5s
      retries: 20

  proxy:
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/health/"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  web_nuxt_api_down:
  web_nuxt_prod:

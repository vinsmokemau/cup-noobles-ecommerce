# End-to-end stack (SPEC.md §4.6, T1.13b). Used with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up --wait
# Every provider is pinned to its mock, whatever the shell says, webhooks fire at once,
# and the api migrates and runs `seed_e2e` before it serves.

# (Compose merges `environment` across files, so only the e2e values are set here.)
x-e2e-env: &e2e-env
  PAYMENT_PROVIDER: mock
  CARRIER_PROVIDER: mock
  EMAIL_PROVIDER: file
  MEDIA_STORAGE: local
  POSTAL_CODE_DATASET: sample
  ERROR_TRACKING: "off"
  INVOICE_PROVIDER: manual
  DEV_TOOLS_ENABLED: "true"
  MOCK_WEBHOOK_DELAY_SECONDS: "0"
  # Every spec reaches the API from one address, so the guest lookup's 5 per hour would fail the
  # /rastrear specs (G66). Read by dev.py only; the limit is proven at the API (P6-V18).
  RATELIMIT_ENABLE: "false"
  # Required while a variant carries a purchase limit; the E2E seed has one (D15, OA-86).
  PURCHASE_LIMIT_WINDOW_DAYS: "30"

# Playwright and Lighthouse run inside the compose network from this image (T15.5): the official
# Playwright image, pinned to the project's `@playwright/test` version, with the browsers in it.
# `make test-all` runs it with `docker compose run`. Each runner sits behind a profile, and every
# `up` that enables one names the services it starts, so `up` never starts a runner.
# A runner shares the network of the service it tests, so `localhost` inside it is that service:
# the specs keep the addresses a customer's browser uses, and the offline guard keeps passing.
x-e2e-runner: &e2e-runner
  profiles: [e2e]
  build:
    context: ./web
    dockerfile: Dockerfile.e2e
    secrets:
      - node_auth_token
  image: cupnoobles-e2e
  working_dir: /repo/web
  # Recommended by Playwright for Chromium in Docker: reaps browser processes; shared memory.
  init: true
  ipc: host
  environment:
    # Tells the harness there is no Docker CLI here; the Makefile starts and stops the stack.
    E2E_IN_COMPOSE: "1"
    CI: ${CI:-}
  volumes:
    # The whole repository: the specs, var/ (the seed manifest, the email files) and the reports.
    - ./:/repo
    # The image's own dependencies and generated types, never the host's.
    - e2e_node_modules:/repo/web/node_modules
    - e2e_nuxt:/repo/web/.nuxt

services:
  # The E2E stack has its own database volume (ADR-0070, G63): the development volume `pgdata` is
  # never mounted here, so an E2E run cannot touch development data and `make e2e-reset` can wipe
  # this one alone. The mount replaces the one in docker-compose.yml (same container path).
  db:
    volumes:
      - pgdata_e2e:/var/lib/postgresql/data
    # Only a `db` container made with this file answers to `db-e2e`. Inside the `e2e` service,
    # where there is no Docker CLI, that is how Playwright tells it is on the E2E volume (G69).
    networks:
      default:
        aliases:
          - db-e2e

  api:
    environment:
      <<: *e2e-env
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py seed_e2e && python manage.py runserver 0.0.0.0:8000
    healthcheck:
      # The first schema request runs alone, here: drf-spectacular loads its extensions lazily and
      # two concurrent first requests (the desktop and mobile projects) can crash it with a 500.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; [u.urlopen('http://localhost:8000' + p) for p in ('/api/health/', '/api/schema/')]"
      interval: 3s
      timeout: 5s
      retries: 40

  mock-webhooks:
    environment:
      <<: *e2e-env

  # The scheduler is off here (§4.8, G77): no job fires in the middle of a spec, and a spec moves
  # the clock-driven jobs itself through `POST /dev/test/run/` (T15.3). No command enables this
  # profile; `make e2e`, `e2e-all` and `e2e-reset` also remove a scheduler the development stack
  # left running.
  scheduler:
    profiles: [scheduler-off-in-e2e]

  web:
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

  # The storefront with its API target unreachable, for P12-V25 (T12.10). It is off unless the
  # `api-down` profile is asked for; the spec starts and stops it. Nitro bakes the proxy target at
  # start, so this needs its own server. It does not depend on `api`.
  web-api-down:
    profiles: [api-down]
    build:
      context: ./web
      secrets:
        - node_auth_token
    command: ["pnpm", "dev", "--host", "0.0.0.0", "--port", "3001"]
    environment:
      NUXT_API_SERVER_TARGET: http://api-unreachable.invalid:8000
      NUXT_PUBLIC_API_BASE: /api
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./web:/app
      - ./api/openapi.snapshot.yml:/api/openapi.snapshot.yml:ro
      - web_node_modules:/app/node_modules
      - web_nuxt_api_down:/app/.nuxt
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/').then(() => process.exit(0)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

  # The storefront as a production build, for the Lighthouse budgets (T12.12, P12-V02): the dev
  # server that `web` runs is not what a customer gets, and its size and blocking time would fail
  # any budget. Off unless the `lighthouse` profile is asked for; the test starts and stops it.
  web-prod:
    profiles: [lighthouse]
    build:
      context: ./web
      secrets:
        - node_auth_token
    command:
      - sh
      - -c
      - pnpm exec nuxt prepare && pnpm build && node .output/server/index.mjs
    environment:
      NUXT_API_SERVER_TARGET: http://api:8000
      NUXT_PUBLIC_API_BASE: /api
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      - ./web:/app
      - ./api/openapi.snapshot.yml:/api/openapi.snapshot.yml:ro
      - web_node_modules:/app/node_modules
      - web_nuxt_prod:/app/.nuxt
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 10s
      retries: 90
      start_period: 30s

  # Caddy in front of `web-prod`, on port 8081: the same routes as `proxy`, a different storefront.
  proxy-prod:
    profiles: [lighthouse]
    image: caddy:2.10-alpine
    environment:
      SITE_ADDRESS: ":8081"
      WEB_UPSTREAM: web-prod:3000
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/api/health/"]
      interval: 3s
      timeout: 5s
      retries: 20

  proxy:
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/health/"]
      interval: 3s
      timeout: 5s
      retries: 20

  # The specs, at http://localhost:8080 (the proxy).
  e2e:
    <<: *e2e-runner
    network_mode: service:proxy

  # P12-V25, at http://localhost:3001 (the storefront with its API unreachable).
  e2e-api-down:
    <<: *e2e-runner
    profiles: [api-down]
    network_mode: service:web-api-down

  # The Lighthouse budgets, at http://localhost:8081 (the production build behind its own proxy).
  e2e-lighthouse:
    <<: *e2e-runner
    profiles: [lighthouse]
    network_mode: service:proxy-prod

volumes:
  # A fixed name, so `make e2e-reset` removes exactly this volume whatever the Compose project is.
  pgdata_e2e:
    name: cupnoobles_pgdata_e2e
  web_nuxt_api_down:
  web_nuxt_prod:
  e2e_node_modules:
  e2e_nuxt:

# Continuous integration (SPEC.md §0.3, §4.5, T1.9, T15.5). Two jobs run on every push and pull
# request: `test-all` runs `make test-all`, and `clean-clone-offline` runs it again from the same
# fresh checkout with the project network internal (P15-V14). Branch protection on `main` requires
# the `test-all` check (an owner step).
name: ci

on:
  push:
  pull_request:

# A run superseded by a newer push to the same branch is cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Design System packages are private on GitHub Packages (§4.5).
permissions:
  contents: read
  packages: read

jobs:
  test-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Cache hypothesis examples
        uses: actions/cache@v4
        with:
          path: api/.hypothesis
          key: hypothesis-${{ runner.os }}-${{ github.sha }}
          restore-keys: hypothesis-${{ runner.os }}-

      # Every step runs in the compose images, the linters and Playwright too (T15.5), so the runner
      # installs nothing: it needs Docker, make and git. The image builds read NODE_AUTH_TOKEN as a
      # build secret (docker-compose.yml).
      # `var/` is gitignored. If Docker creates it through the bind mount it is owned by root, and
      # the Makefile's host-side redirects into it (traceability, ratchet) fail with "Permission denied".
      - name: make test-all
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p var
          make test-all

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile "*" down --volumes

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: |
            api/htmlcov/
            web/coverage/
          if-no-files-found: ignore

      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore

  # The local acceptance exit criterion (SPEC.md Phase 15, P15-V14): from a fresh checkout, with
  # nothing installed on the runner, every image is built and pulled, and then the whole suite runs
  # with the project network internal, so no container can reach the internet (REQ-042).
  # `make clean-clone-check` reproduces this job on a developer's machine.
  clean-clone-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      # The step's name carries the Verify ID: the traceability check reads it from this file.
      - name: p15_v14 clean clone passes test-all offline
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p var
          make test-all-offline

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile "*" down --volumes

      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-offline
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore

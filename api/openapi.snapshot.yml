openapi: 3.1.0
info:
  title: Cup Noobles API
  version: 1.0.0
paths:
  /api/catalog/categories/:
    get:
      operationId: catalog_categories_list
      description: '`GET /api/catalog/categories/`: active categories, nested by parent.'
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryNode'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prelaunch'
          description: Pre-launch mode is on and the request is anonymous (G32, ADR-0038).
  /api/catalog/facets/:
    get:
      operationId: catalog_facets_retrieve
      description: '`GET /api/catalog/facets/`: the filter values of the products
        the query matches.'
      parameters:
      - in: query
        name: attr.<key>
        schema:
          type: string
        description: Keeps products whose attribute `<key>` equals the value, for
          example `attr.linea=Nendoroid`. `<key>` must be in the `filterable_keys`
          of a product type (of the `type` filter, when given); any other key is a
          400. The facets endpoint lists the keys and their values.
      - in: query
        name: brand
        schema:
          type: string
          maxLength: 200
          minLength: 1
      - in: query
        name: category
        schema:
          type: string
          maxLength: 200
          minLength: 1
        description: Category slug; includes its descendants.
      - in: query
        name: franchise
        schema:
          type: string
          maxLength: 200
          minLength: 1
      - in: query
        name: in_stock
        schema:
          type: boolean
        description: '`true` keeps products with a unit available.'
      - in: query
        name: max_price
        schema:
          type: integer
          minimum: 0
        description: Centavos of MXN, IVA included.
      - in: query
        name: min_price
        schema:
          type: integer
          minimum: 0
        description: Centavos of MXN, IVA included.
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
          minLength: 1
      - in: query
        name: type
        schema:
          type: string
          maxLength: 200
          minLength: 1
        description: Product type code.
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facets'
          description: ''
        '400':
          description: A query parameter is invalid.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prelaunch'
          description: Pre-launch mode is on and the request is anonymous (G32, ADR-0038).
  /api/catalog/products/:
    get:
      operationId: catalog_products_list
      description: '`GET /api/catalog/products/`'
      parameters:
      - in: query
        name: attr.<key>
        schema:
          type: string
        description: Keeps products whose attribute `<key>` equals the value, for
          example `attr.linea=Nendoroid`. `<key>` must be in the `filterable_keys`
          of a product type (of the `type` filter, when given); any other key is a
          400. The facets endpoint lists the keys and their values.
      - in: query
        name: brand
        schema:
          type: string
          maxLength: 200
          minLength: 1
      - in: query
        name: category
        schema:
          type: string
          maxLength: 200
          minLength: 1
        description: Category slug; includes its descendants.
      - name: cursor
        required: false
        in: query
        description: El valor del cursor de paginación.
        schema:
          type: string
      - in: query
        name: franchise
        schema:
          type: string
          maxLength: 200
          minLength: 1
      - in: query
        name: in_stock
        schema:
          type: boolean
        description: '`true` keeps products with a unit available.'
      - in: query
        name: max_price
        schema:
          type: integer
          minimum: 0
        description: Centavos of MXN, IVA included.
      - in: query
        name: min_price
        schema:
          type: integer
          minimum: 0
        description: Centavos of MXN, IVA included.
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
          minLength: 1
      - in: query
        name: type
        schema:
          type: string
          maxLength: 200
          minLength: 1
        description: Product type code.
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductCardList'
          description: ''
        '400':
          description: A query parameter is invalid.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prelaunch'
          description: Pre-launch mode is on and the request is anonymous (G32, ADR-0038).
  /api/catalog/products/{slug}/:
    get:
      operationId: catalog_products_retrieve
      description: '`GET /api/catalog/products/{slug}/`: a draft or archived product
        is a 404.'
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
          description: ''
        '404':
          description: No active product has this slug.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prelaunch'
          description: Pre-launch mode is on and the request is anonymous (G32, ADR-0038).
  /api/catalog/search/:
    get:
      operationId: catalog_search_list
      description: '`GET /api/catalog/search/?q=`: best match first, at most `SEARCH_LIMIT`
        products.'
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Words to find.
        required: true
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductCard'
          description: ''
        '400':
          description: A query parameter is invalid.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prelaunch'
          description: Pre-launch mode is on and the request is anonymous (G32, ADR-0038).
  /api/health/:
    get:
      operationId: health_retrieve
      description: '`GET /api/health/`: the database answers `SELECT 1`, or the service
        is unhealthy.'
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: The database is reachable.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: The database is unreachable.
  /api/orders/lookup/:
    post:
      operationId: orders_lookup
      description: |-
        `POST /api/orders/lookup/` with `{number, email}`.

        The email travels in the body so no proxy, CDN or error log records it. A wrong email and a
        missing order return the same 404. Every call counts toward the limit, 5 per hour per IP.
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderLookupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderLookupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderLookupRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatus'
          description: ''
        '400':
          description: The number or the email is missing.
        '404':
          description: No order has that number and email (the same body for both).
        '429':
          description: More than 5 lookups in an hour from this IP.
  /api/postal-codes/{cp}/:
    get:
      operationId: postal_codes_retrieve
      description: '`GET /api/postal-codes/{cp}/`: 400 for a malformed code, 404 for
        an unknown one.'
      parameters:
      - in: path
        name: cp
        schema:
          type: string
        required: true
      tags:
      - postal-codes
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostalCode'
          description: ''
        '400':
          description: The postal code is not 5 digits.
        '404':
          description: The postal code is not in the dataset.
components:
  schemas:
    Availability:
      type: object
      description: '`{"status": "in_stock" | "low_stock" | "out_of_stock"}`; no raw
        counts (D10 stand-in).'
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - status
    CategoryNode:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
          readOnly: true
      required:
      - children
      - name
      - slug
    DetailImage:
      type: object
      description: A product image as its derivatives; the original is never given
        out (T3.5).
      properties:
        alt:
          type: string
        width:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: -2147483648
        height:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: -2147483648
        sources:
          type: array
          items:
            $ref: '#/components/schemas/ImageSource'
          readOnly: true
        variant:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
      required:
      - sources
      - variant
    Facet:
      type: object
      properties:
        key:
          type: string
          description: The attribute key; filter with `attr.<key>`.
        title:
          type: string
        values:
          type: array
          items:
            $ref: '#/components/schemas/FacetValue'
      required:
      - key
      - title
      - values
    FacetValue:
      type: object
      properties:
        value:
          description: A string, number or boolean.
        count:
          type: integer
          description: Products that match every active filter.
      required:
      - count
      - value
    Facets:
      type: object
      properties:
        facets:
          type: array
          items:
            $ref: '#/components/schemas/Facet'
      required:
      - facets
    FulfillmentMethodEnum:
      enum:
      - delivery
      - pickup
      type: string
      description: |-
        * `delivery` - Delivery
        * `pickup` - Pickup
    Health:
      type: object
      properties:
        db:
          type: string
      required:
      - db
    ImageSource:
      type: object
      properties:
        width:
          type: integer
        url:
          type: string
      required:
      - url
      - width
    OrderLookupRequest:
      type: object
      properties:
        number:
          type: string
          maxLength: 64
        email:
          type: string
          maxLength: 254
      required:
      - email
      - number
    OrderStatus:
      type: object
      properties:
        number:
          type: string
        public_id:
          type: string
          format: uuid
          readOnly: true
        state:
          $ref: '#/components/schemas/StateEnum'
        fulfillment_method:
          $ref: '#/components/schemas/FulfillmentMethodEnum'
        shipping_rate_name:
          type: string
        subtotal_cents:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        shipping_cents:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        discount_cents:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        total_cents:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        tax_included_cents:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        currency:
          type: string
          maxLength: 3
        payment_deadline_at:
          type:
          - string
          - 'null'
          format: date-time
        placed_at:
          type:
          - string
          - 'null'
          format: date-time
        paid_at:
          type:
          - string
          - 'null'
          format: date-time
        shipped_at:
          type:
          - string
          - 'null'
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        cancelled_at:
          type:
          - string
          - 'null'
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderStatusLine'
          readOnly: true
        shipments:
          type: array
          items:
            $ref: '#/components/schemas/OrderStatusShipment'
          readOnly: true
      required:
      - fulfillment_method
      - lines
      - number
      - public_id
      - shipments
      - state
      - subtotal_cents
      - total_cents
    OrderStatusLine:
      type: object
      properties:
        sku:
          type: string
        product_name:
          type: string
        options_snapshot: {}
        image_key:
          type: string
        quantity:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        unit_price_cents:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        line_total_cents:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        is_preorder:
          type: boolean
        expected_release_date:
          type:
          - string
          - 'null'
          format: date
      required:
      - line_total_cents
      - product_name
      - quantity
      - sku
      - unit_price_cents
    OrderStatusShipment:
      type: object
      properties:
        carrier:
          type: string
        tracking_number:
          type: string
        tracking_url:
          type: string
        shipped_at:
          type: string
          format: date-time
        delivered_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - carrier
      - tracking_number
    PaginatedProductCardList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProductCard'
    PostalCode:
      type: object
      properties:
        state_code:
          type: string
        state_name:
          type: string
        municipality:
          type: string
        neighborhoods:
          type: array
          items:
            type: string
      required:
      - municipality
      - neighborhoods
      - state_code
      - state_name
    Prelaunch:
      type: object
      properties:
        prelaunch:
          type: boolean
      required:
      - prelaunch
    ProductCard:
      type: object
      description: The list entry. Read `public_variants` and `images`, which the
        view prefetches.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
        name:
          type: string
        subtitle:
          type: string
        product_type:
          type: string
        brand:
          oneOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        franchise:
          oneOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        price_cents:
          type:
          - integer
          - 'null'
          readOnly: true
        compare_at_cents:
          type:
          - integer
          - 'null'
          readOnly: true
        availability:
          allOf:
          - $ref: '#/components/schemas/Availability'
          readOnly: true
        image:
          oneOf:
          - $ref: '#/components/schemas/PublicImage'
          - type: 'null'
          readOnly: true
      required:
      - availability
      - brand
      - compare_at_cents
      - franchise
      - image
      - name
      - price_cents
      - product_type
      - public_id
      - slug
    ProductDetail:
      type: object
      description: The list entry. Read `public_variants` and `images`, which the
        view prefetches.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
        name:
          type: string
        subtitle:
          type: string
        product_type:
          type: string
        brand:
          oneOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        franchise:
          oneOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        price_cents:
          type:
          - integer
          - 'null'
          readOnly: true
        compare_at_cents:
          type:
          - integer
          - 'null'
          readOnly: true
        availability:
          allOf:
          - $ref: '#/components/schemas/Availability'
          readOnly: true
        image:
          oneOf:
          - $ref: '#/components/schemas/PublicImage'
          - type: 'null'
          readOnly: true
        description_md:
          type: string
        attributes: {}
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Reference'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/PublicVariant'
        images:
          type: array
          items:
            $ref: '#/components/schemas/DetailImage'
        related:
          type: array
          items:
            $ref: '#/components/schemas/ProductCard'
          readOnly: true
      required:
      - availability
      - brand
      - categories
      - compare_at_cents
      - franchise
      - image
      - images
      - name
      - price_cents
      - product_type
      - public_id
      - related
      - slug
      - variants
    PublicImage:
      type: object
      description: A product image as its derivatives; the original is never given
        out (T3.5).
      properties:
        alt:
          type: string
        width:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: -2147483648
        height:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: -2147483648
        sources:
          type: array
          items:
            $ref: '#/components/schemas/ImageSource'
          readOnly: true
      required:
      - sources
    PublicVariant:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        sku:
          type: string
        options: {}
        price_cents:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        compare_at_cents:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: -2147483648
        availability:
          allOf:
          - $ref: '#/components/schemas/Availability'
          readOnly: true
      required:
      - availability
      - price_cents
      - public_id
      - sku
    Reference:
      type: object
      description: A brand, franchise or category, by slug.
      properties:
        slug:
          type: string
        name:
          type: string
      required:
      - name
      - slug
    StateEnum:
      enum:
      - draft
      - pending_payment
      - paid
      - awaiting_stock
      - preparing
      - ready_for_pickup
      - shipped
      - delivered
      - picked_up
      - completed
      - cancelled
      - expired
      - refunded
      - partially_refunded
      type: string
      description: |-
        * `draft` - draft
        * `pending_payment` - pending_payment
        * `paid` - paid
        * `awaiting_stock` - awaiting_stock
        * `preparing` - preparing
        * `ready_for_pickup` - ready_for_pickup
        * `shipped` - shipped
        * `delivered` - delivered
        * `picked_up` - picked_up
        * `completed` - completed
        * `cancelled` - cancelled
        * `expired` - expired
        * `refunded` - refunded
        * `partially_refunded` - partially_refunded
    StatusEnum:
      enum:
      - in_stock
      - low_stock
      - out_of_stock
      type: string
      description: |-
        * `in_stock` - in_stock
        * `low_stock` - low_stock
        * `out_of_stock` - out_of_stock

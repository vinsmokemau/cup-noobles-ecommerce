                {{ item_quantity }}

              <td
                style="
                  padding: 0 0 8px 16px;
                  text-align: right;
                  vertical-align: top;
                  white-space: nowrap;
                  color: #f5f5f5;
                "
              >
                {{ item_amount }}

                </td>

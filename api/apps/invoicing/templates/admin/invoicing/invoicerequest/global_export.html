{% extends "admin/base_site.html" %}

{% block content %}
<div id="content-main">
  <p><a href="{{ list_url }}">Volver a Facturas (CFDI)</a></p>
  <form method="get" id="global-export">
    <fieldset class="module aligned">
      <h2>Exportar para factura global</h2>
      <p>Pedidos pagados en el rango, en hora de la tienda, sin CFDI emitido. No incluye pedidos cancelados ni vencidos.</p>
      {{ form.as_div }}
      <div class="submit-row"><input type="submit" value="Descargar CSV"></div>
    </fieldset>
  </form>
</div>
{% endblock %}
